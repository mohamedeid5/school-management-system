services:

  # ─────────────────────────────────────────
  # PHP-FPM (Development - code is mounted live)
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development        # ← يبني الـ dev stage فقط (بدون COPY للكود)
    container_name: school_app_dev
    restart: unless-stopped
    environment:
      APP_NAME: "School Management System"
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-school_db}
      DB_USERNAME: ${DB_USERNAME:-school_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - .:/var/www/html                        # ← الكود بيتمونت مباشرة (live reload)
      - vendor_cache:/var/www/html/vendor      # ← vendor محفوظ في volume منفصل
      - storage_cache:/var/www/html/storage    # ← storage محفوظ
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - school_network

  # ─────────────────────────────────────────
  # Nginx
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: school_nginx_dev
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro                     # ← نفس الـ mount عشان Nginx يشوف الـ public
    depends_on:
      - app
    networks:
      - school_network

  # ─────────────────────────────────────────
  # MySQL
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: school_mysql_dev
    restart: unless-stopped
    ports:
      - "3306:3306"                            # ← expose للـ local DB clients (TablePlus etc)
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-school_db}
      MYSQL_USER: ${DB_USERNAME:-school_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school_network

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: school_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"                            # ← expose للـ local Redis clients
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school_network

volumes:
  mysql_data_dev:
  vendor_cache:
  storage_cache:

networks:
  school_network:
    driver: bridge
