; Production PHP settings
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Error handling (hide errors in production)
display_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-errors.log

; Date
date.timezone = Africa/Cairo
