name: Laravel CI (Tests)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 سحب الكود من المستودع
      uses: actions/checkout@v4

    - name: 🐘 تجهيز بيئة PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite3, pdo_sqlite, bcmath, gd
        coverage: none

    - name: ⚙️ تجهيز ملف الإعدادات (.env)
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: 📦 تسطيب الباكدجات (Composer)
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: 🔑 توليد مفتاح لارافل
      run: php artisan key:generate

    - name: 🧪 تشغيل المفتش (Tests)

      run: php artisan test
